version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: tarea4_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: produccion_bigdata
    volumes:
      - mongo_data:/data/db
      - ./scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - tarea4_net

  mongo-express:
    image: mongo-express:latest
    container_name: tarea4_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - tarea4_net

volumes:
  mongo_data:

networks:
  tarea4_net:
    driver: bridge
